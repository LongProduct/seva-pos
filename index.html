<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seva Retail — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- ===== HEADER (1 tầng, compact) ===== -->
  <header class="header">
    <!-- 1. Search -->
    <div class="search-wrap">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <input class="search-input" id="searchInput" placeholder="Tìm hoặc quét sản phẩm... (F3)" autocomplete="off">
      <span class="search-hint">F3</span>
      <button class="search-clear" id="searchClear" aria-label="Xóa">✕</button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <!-- 2+3. Tab giỏ + tạo giỏ mới -->
    <div class="carttabs" id="cartTabs"></div>

    <div class="hdr-spacer"></div>

    <!-- 4. Store switcher -->
    <div class="hdr-store">
      <button class="store-btn" id="storeBtn" onclick="toggleStorePop(event)">Flagship Hà Nội · Store <span class="caret">▼</span></button>
      <div class="popover store-popover" id="storePop"></div>
    </div>

    <!-- 5. Trạng thái + thiết bị (icon) -->
    <div class="hdr-status">
      <span class="pill pill-online" id="connPill"><span class="status-dot"></span>Online</span>
      <span class="dev-ic on" title="Máy quét barcode: đã kết nối"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M7 6v12M11 6v12M15 6v12M19 6v12"/></svg></span>
      <span class="dev-ic on" title="Máy in: sẵn sàng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="6"/><rect x="4" y="9" width="16" height="8" rx="1"/><rect x="7" y="15" width="10" height="6"/></svg></span>
      <span class="dev-ic on" title="PAYOO: đã kết nối"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
    </div>

    <!-- 6. Màn hình khách hàng -->
    <button class="dev-ic btn" onclick="openCustomerDisplay()" title="Mở màn hình khách hàng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></button>

    <!-- 7. User -->
    <div class="acct" title="Nguyễn Minh — Đang đăng nhập"><div class="avatar">NM</div><span class="acct-name">Nguyễn Minh</span><span class="caret">▼</span></div>

    <!-- 8. Khóa -->
    <button class="icon-btn" title="Khóa màn hình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </header>

  <!-- ===== OFFLINE BANNER ===== -->
  <div class="offline-banner" id="offlineBanner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
    Đang ngoại tuyến — Dữ liệu sản phẩm và tồn kho có thể chưa cập nhật.
  </div>

  <!-- ===== MAIN (scan-first) ===== -->
  <div class="main">
    <!-- TRÁI: Cart Workspace -->
    <section class="cart-workspace">
      <div class="target-ribbon" id="targetRibbon"></div>
      <div class="cart-list-region" id="cartListRegion"></div>
    </section>

    <!-- PHẢI: Order Information (giữ payment flow trong panel này) -->
    <aside class="cart-panel" id="cartPanel"></aside>
  </div>
</div>

<!-- ===== CATALOG DRAWER (Duyệt danh mục — chức năng phụ) ===== -->
<div class="catalog-scrim" id="catalogScrim" onclick="closeCatalog()"></div>
<aside class="catalog-drawer" id="catalogDrawer">
  <div class="catalog-head">
    <div class="catalog-title">Duyệt danh mục</div>
    <div class="catalog-sub" id="catalogTarget"></div>
    <button class="vs-close" onclick="closeCatalog()">✕</button>
  </div>
  <div class="catstrip" id="catStrip"></div>
  <div class="toolbar">
    <span class="tb-count"><strong id="resCount">0</strong> sản phẩm</span>
    <span id="filterChips"></span>
    <span class="tb-spacer"></span>
    <button class="tb-btn" id="filterInStock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Còn hàng</button>
  </div>
  <div class="product-grid" id="productGrid"></div>
</aside>

<!-- ===== QUICK CUSTOMER MODAL ===== -->
<div class="scrim" id="custScrim">
  <div class="modal">
    <h2>Tạo khách hàng nhanh</h2>
    <p class="sub">Tạo hồ sơ và gắn vào giỏ hiện tại.</p>
    <div class="mfield">
      <label>Số điện thoại <span class="req">*</span></label>
      <input id="custPhone" placeholder="09xx xxx xxx" autocomplete="off">
      <div class="merr" id="custPhoneErr"></div>
    </div>
    <div class="mfield">
      <label>Họ và tên <span class="req">*</span></label>
      <input id="custName" placeholder="Nguyễn Văn A" autocomplete="off">
      <div class="merr" id="custNameErr"></div>
    </div>
    <div class="mrow">
      <div class="mfield"><label>Ngày sinh</label><input id="custDob" type="date"></div>
      <div class="mfield"><label>Giới tính</label>
        <select id="custGender"><option value="">—</option><option>Nữ</option><option>Nam</option><option>Khác</option></select>
      </div>
    </div>
    <label class="mcheck"><input type="checkbox" id="custMember" checked> Đồng ý tham gia chương trình thành viên</label>
    <label class="mcheck"><input type="checkbox" id="custMkt"> Nhận thông tin ưu đãi</label>
    <div class="mstatus" id="custStatus"></div>
    <div class="mactions">
      <button class="mbtn mbtn-ghost" onclick="closeModal('custScrim')">Hủy</button>
      <button class="mbtn mbtn-primary" id="custConfirm">Tạo và gắn vào giỏ</button>
    </div>
  </div>
</div>

<!-- ===== VOUCHER MODAL ===== -->
<div class="scrim" id="voucherScrim" onclick="if(event.target===this)closeModal('voucherScrim')">
  <div class="modal">
    <h2>Chọn voucher</h2>
    <p class="sub">Ưu đãi áp dụng cho giỏ hiện tại.</p>
    <div class="voucher-list" id="voucherList"></div>
    <div class="mactions"><button class="mbtn mbtn-ghost" onclick="closeModal('voucherScrim')">Đóng</button></div>
  </div>
</div>

<!-- ===== RECEIPT MODAL ===== -->
<div class="scrim" id="receiptScrim">
  <div class="receipt" id="receiptPrint"></div>
</div>

<!-- ===== VARIANT SELECTOR: QUICK POPOVER ===== -->
<div class="scrim vs-scrim" id="vsScrim" onclick="if(event.target===this)closeSelector()">
  <div class="vs-popover" id="vsPopover"></div>
</div>

<!-- ===== VARIANT SELECTOR: DRAWER (variant & serial) ===== -->
<div class="vs-drawer-scrim" id="vsDrawerScrim" onclick="closeSelector()"></div>
<aside class="vs-drawer" id="vsDrawer"></aside>

<!-- ===== TOASTS ===== -->
<div class="toasts" id="toasts"></div>

<!-- ===== DEMO CONTROLS ===== -->
<div class="demo-toggle" onclick="toggleOffline()">
  <div class="switch" id="offSwitch"></div>Offline demo
</div>
<div class="demo-barcode">
  <input id="barcodeDemo" placeholder="Quét thử: 893... / NHA-AUR-12 / SV001" onkeydown="if(event.key==='Enter'){simulateBarcodeScan(this.value);this.value=''}">
  <button onclick="var b=document.getElementById('barcodeDemo');simulateBarcodeScan(b.value);b.value=''">Quét</button>
</div>

<script src="script.js"></script>
</body>
</html>
